# Mock environment — all services point to the embedded WireMock server
# WireMock runs on localhost:9999 (see MockServerManager.PORT)
api.base.url.user=http://localhost:9999
api.base.url.auth=http://localhost:9999
api.base.url.product=http://localhost:9999
api.base.url.order=http://localhost:9999

# Generous timeouts — raise socket.timeout below the stub delay to test timeout paths
api.connection.timeout=5000
api.socket.timeout=10000

# Auth not used in mock env — TokenManager is bypassed when stubs handle /login
api.auth.email=mock@test.com
api.auth.password=mockpassword
api.auth.token.ttl.seconds=3600
api.auth.token.buffer.seconds=30
