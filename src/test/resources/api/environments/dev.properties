# DEV environment — replace with real internal dev service URLs
api.base.url.user=https://dev-api.example.com/api
api.base.url.auth=https://dev-api.example.com/api
api.base.url.product=https://dev-api.example.com
api.base.url.order=https://dev-api.example.com

api.connection.timeout=15000
api.socket.timeout=45000

# Credentials used by TokenManager to obtain the shared bearer token once per JVM run
api.auth.email=dev-user@example.com
api.auth.password=dev-password
# TTL fallback (seconds) when the login response has no "expires_in" field
api.auth.token.ttl.seconds=3600
# Proactive refresh window — token is refreshed this many seconds before expiry
api.auth.token.buffer.seconds=30
