# STAGING environment — replace with real staging service URLs
api.base.url.user=https://staging-api.example.com/api
api.base.url.auth=https://staging-api.example.com/api
api.base.url.product=https://staging-api.example.com
api.base.url.order=https://staging-api.example.com

api.connection.timeout=12000
api.socket.timeout=35000

# Credentials used by TokenManager to obtain the shared bearer token once per JVM run
api.auth.email=staging-user@example.com
api.auth.password=staging-password
# TTL fallback (seconds) when the login response has no "expires_in" field
api.auth.token.ttl.seconds=3600
# Proactive refresh window — token is refreshed this many seconds before expiry
api.auth.token.buffer.seconds=30
