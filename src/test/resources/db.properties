# JDBC connection for test data verification
# Override any key at runtime with -D flags, e.g.:
#   -Ddb.url=jdbc:mysql://host:3306/mydb -Ddb.username=tester -Ddb.password=secret
#
# Switch to an environment-specific file with -Ddb.env=<name>
# (looks for db/<name>.properties on the classpath)
#
# Defaults below use H2 in-memory — no DB setup required for local/CI runs.
# Swap to your real DB URL for integration testing against a live schema.

db.driver=org.h2.Driver
db.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.username=sa
db.password=

# MySQL example:
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/mydb?useSSL=false&serverTimezone=UTC
# db.username=root
# db.password=secret

# PostgreSQL example:
# db.driver=org.postgresql.Driver
# db.url=jdbc:postgresql://localhost:5432/mydb
# db.username=postgres
# db.password=secret
